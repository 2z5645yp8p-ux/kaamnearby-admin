
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaamNearby Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6f3;
      color: #17382b;
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 440px;
      margin: 55px auto;
      background: white;
      padding: 26px;
      border-radius: 16px;
      box-shadow: 0 4px 24px #00000010;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
    }
    input { border: 1px solid #ccd7d0; }
    button {
      background: #176b49;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>KaamNearby Admin</h1>
    <p>Sign in with your administrator account.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <section id="dashboard" hidden>
      <h2>Admin access verified</h2>
      <p id="account"></p>
      <button id="logoutButton" type="button">Logout</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://wbhttdwajcdidkioatqn.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BQee1ylNh02Ii4PaM13Ckg_mlBmgrnc";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const status = document.getElementById("status");

    async function verifyAdmin(user) {
      const { data, error } = await client
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) {
        throw new Error(
          "Admin check failed. Check the admin_users table policy."
        );
      }

      if (!data) {
        await client.auth.signOut();
        throw new Error("This account is not an authorized admin.");
      }

      form.hidden = true;
      dashboard.hidden = false;
      document.getElementById("account").textContent =
        "Signed in as " + (user.email || "Admin");
      status.textContent = "";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("loginButton");
      button.disabled = true;
      status.textContent = "Signing in...";

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;
        await verifyAdmin(data.user);
      } catch (error) {
        status.textContent = error.message || "Login failed.";
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("logoutButton").addEventListener(
      "click", async () => {
        await client.auth.signOut();
        dashboard.hidden = true;
        form.hidden = false;
        status.textContent = "Logged out.";
      }
    );
  </script>
</body>
</html>
